<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h2>Registration Form</h2>

    <form>
        <label> Name:</label>
        <input type="text" name="fullname" required>
        <br><br>
        <label>Father's Name:</label>
        <input type="Father's Name" name="Father's Name" required>
        <br><br>
        <label>Admission No:</label>
        <input type="Admission No" name="Admission No" required>
        <br><br>
        <label>Roll no:</label>
        <input type="Roll No" name="Roll No" required>
        <br><br>
        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Course:</label>
        <input type="Course" name="Course" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <br><br>

        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>

        <label>Country:</label>
        <select name="country">
            <option>India</option>
            <option>USA</option>
            <option>UK</option>
            <option>Canada</option>
        </select>
        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
